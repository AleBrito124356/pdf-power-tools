[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-power-tools"
version = "0.3.0"
description = "One CLI and library for everything PDF: merge, split, compress, watermark, encrypt, extract text/tables/images, fill forms and OCR."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Alejandro Brito" }]
keywords = ["pdf", "cli", "merge", "split", "compress", "watermark", "ocr", "forms", "pypdf", "pdfplumber"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
    "Topic :: Office/Business",
]
dependencies = [
    "pypdf>=5.1.0",
    "pdfplumber>=0.11.0",
    "Pillow>=10.0.0",
    "pypdfium2>=4.20.0",
    "reportlab>=4.0.0",
    "pytesseract>=0.3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
pdftool = "pdftools.cli:main"

[project.urls]
Homepage = "https://github.com/AleBrito124356/pdf-power-tools"
Issues = "https://github.com/AleBrito124356/pdf-power-tools/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
